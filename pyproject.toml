[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stopots-bot"
version = "2.0.0"
description = "Assistente local para StopotS em português"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-YGP-NoResale-1.0 AND MIT"
license-files = ["LICENSE", "LICENSES/*", "AUTHORS.md", "CREDITS.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Yuri Garcia Pardinho"}]
maintainers = [{name = "Yuri Garcia Pardinho"}]
dependencies = ["playwright==1.64.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
desktop = ["pyside6-essentials==6.10.2"]

[project.urls]
Homepage = "https://github.com/yurigarciapardinho/stopots-bot"
Issues = "https://github.com/yurigarciapardinho/stopots-bot/issues"
Documentation = "https://github.com/yurigarciapardinho/stopots-bot/tree/main/docs"

[dependency-groups]
build = ["build==1.3.0", "pyinstaller==6.22.3", "setuptools==84.1.0", "wheel"]
audit = ["pip-audit>=2.9,<3", "cyclonedx-bom>=6,<8", "ruff>=0.14,<1"]

[project.scripts]
stopots-v2 = "stopots_v2.cli:main"

[project.gui-scripts]
stopots-assistente = "stopots_v2.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stopots_v2 = ["resources/*.json", "adapters/*.js", "ui/*.qml", "ui/*.svg", "resources/legal/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "tests/lab"]
pythonpath = ["src"]
markers = ["browser: requer Chrome local, sem conexão externa"]
