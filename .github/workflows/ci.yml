name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.16'
          enable-cache: true
          cache-suffix: ${{ github.event_name }}-${{ runner.os }}
      - if: runner.os == 'Linux'
        run: bash tools/setup_ci_linux.sh
      - run: uv sync --frozen --extra desktop --extra test --group build --group audit
      - run: uv run --frozen --no-sync python tools/check_metadata.py
      - run: uv run --frozen --no-sync ruff check --select E9,F63,F7,F82 src tests tools build_hooks
      - run: uv run --frozen --no-sync pytest -q
      - run: uv run --frozen --no-sync stopots-assistente --verificar-ui
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.16'
          enable-cache: true
          cache-suffix: ${{ github.event_name }}-${{ runner.os }}
      - run: bash tools/setup_ci_linux.sh
      - run: uv sync --frozen --extra desktop --extra test --group build --group audit
      - run: uv build --out-dir .runtime/dist
      - run: uv run --frozen --no-sync python tools/ci_install_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package
          path: .runtime/dist/*
          if-no-files-found: error
          retention-days: 14
  ci-gate:
    if: always()
    needs: [tests, wheel]
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar resultados obrigatórios
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          WHEEL_RESULT: ${{ needs.wheel.result }}
        run: test "$TESTS_RESULT" = success && test "$WHEEL_RESULT" = success
