name: Candidato de release
on:
  workflow_dispatch:
  push:
    branches: ['release-candidate/**']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exigir SHA aprovado na main
        run: git merge-base --is-ancestor HEAD origin/main
      - id: version
        run: python3 -c "import tomllib; print('version='+tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
  linux:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.16'
          enable-cache: true
          cache-suffix: ${{ github.event_name }}-${{ runner.os }}
      - run: bash tools/setup_ci_linux.sh
      - run: uv sync --frozen --extra desktop --extra test --group build --group audit
      - run: uv run --frozen --no-sync pytest -q
      - run: uv build --out-dir .runtime/dist
      - run: uv run --frozen --no-sync python tools/third_party_sources.py
      - run: uv run --frozen --no-sync python tools/package_desktop.py
      - run: uv run --frozen --no-sync python tools/ci_install_wheel.py --frozen
      - run: cp .runtime/validation/installed.json .runtime/dist/INSTALLED_VALIDATION.json
      - run: uv run --frozen --no-sync python tools/release_manifest.py
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            .runtime/dist/*.deb
            .runtime/dist/*.tar.gz
            .runtime/dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-linux
          path: |
            .runtime/dist/*.deb
            .runtime/dist/*.tar.gz
            .runtime/dist/*.whl
            .runtime/dist/*.json
            .runtime/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: guard
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.16'
          enable-cache: true
          cache-suffix: ${{ github.event_name }}-${{ runner.os }}
      - run: uv sync --frozen --extra desktop --extra test --group build --group audit
      - run: uv run --frozen --no-sync pytest -q
      - run: uv build --out-dir .runtime/dist
      - run: uv run --frozen --no-sync python tools/third_party_sources.py
      - run: uv run --frozen --no-sync python tools/package_desktop.py
      - run: uv run --frozen --no-sync python tools/ci_install_wheel.py --frozen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-experimental
          path: .runtime/dist/*.zip
          if-no-files-found: error
          retention-days: 30
