name: Segurança
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.16'
          enable-cache: true
          cache-suffix: ${{ github.event_name }}-${{ runner.os }}
      - run: uv sync --frozen --extra desktop --extra test --group build --group audit
      - run: uv run --frozen --no-sync python tools/security_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-reports
          path: .runtime/security/
          if-no-files-found: warn
          retention-days: 14
